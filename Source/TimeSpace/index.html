<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时空漫游</title>
  <link rel="stylesheet" href="css/style.css"></head><body><main>
<div class="card" style="margin:0 0 10px;border:1px solid #2b3a6e">🎮 <b>演示版</b> · 欢迎试空并提意见 <button id="startTour">▶ 开始导览</button> <button id="openFeedback">💡 需求反馈</button><div class="mut">所有数据只保存在你自己的浏览器里。</div></div>
<h1>🌌 时空漫游 <span class="mut">过去亿年 ↔ 未来万年 · 太阳系</span></h1>
<div id="info" class="card"></div>
<div id="g3" class="card" style="padding:0;height:340px;position:relative;overflow:hidden;touch-action:none;cursor:grab"><div id="gl" style="position:absolute;left:10px;top:8px;font-size:13px;color:var(--mut);z-index:2;pointer-events:none"></div></div>
<canvas id="cv" width="720" height="400"></canvas>
<div class="card" style="text-align:center"><div id="clk"></div><div id="clkt" class="mut"></div></div>
<div class="card">
 <div class="big" id="when"></div><div id="where" class="mut"></div>
 <div id="what" style="margin-top:6px"></div>
 <input type="range" id="sl" min="-1000" max="1000" value="0" style="margin-top:10px">
 <div id="track"></div>
 <div class="mut">时间轴为对数刻度:左侧至 2.5 亿年前,右侧至 1 万年后,中间为现在</div>
 <div class="row"><button id="prev">⏮ 上一个</button><button id="play">▶ 电影模式</button><button id="next">下一个 ⏭</button>
 <button id="now">回到现在</button><button id="cc">📚 课程中心</button></div>
 <div class="row" id="chips"></div>
</div>
<div class="card"><b>📝 添加计划</b>(课程 / 旅行)
 <div class="row"><input id="pd" type="date"><select id="pp"><option value="earth">地球</option><option value="moon">月球</option><option value="mars">火星</option><option value="venus">金星</option><option value="jupiter">木星</option></select>
 <select id="pt"><option>旅行</option><option>课程</option></select></div>
 <div class="row"><select id="pc"><option value="35.68,139.69">东京</option><option value="35.01,135.77">京都</option><option value="39.9,116.4">北京</option><option value="48.86,2.35">巴黎</option><option value="40.71,-74">纽约</option><option value="-33.87,151.2">悉尼</option><option value="0.67,23.47">月球·静海</option><option value="18.4,77.5">火星·杰泽罗</option></select><span class="mut">地点(决定 3D 标记位置)</span></div>
 <div class="row"><input id="px" placeholder="计划内容,如:去京都看红叶" style="flex:1;min-width:200px"><button id="add">添加</button></div>
 <div class="row"><select id="ps"></select><button id="simbtn">🔮 推演所选计划</button></div>
 <div id="sim" style="margin-top:8px"></div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body></html>
